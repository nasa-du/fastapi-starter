      @keyframes subIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
      @keyframes ringIn { from { opacity:0; transform: scale(.82); } to { opacity:1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .mark,.word,.sub,.rings { animation:none; opacity:1; transform:none; } }
